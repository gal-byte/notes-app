<!DOCTYPE html>
<!-- lang="he" = Hebrew, dir="rtl" = everything flows right-to-left -->
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- Fit the phone screen. viewport-fit=cover lets us use the full screen on phones with a notch -->
  <!-- interactive-widget: when the keyboard opens, shrink the page so the typing box stays visible -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- Color of the phone's top bar (light / dark) -->
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <title>הפתקים שלי</title>
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>

  <!-- Top bar: back button (only on inner screens) + screen title -->
  <header class="topbar">
    <a id="back-button" class="back-button" href="#/groups" hidden aria-label="חזרה">
      <!-- In right-to-left, "back" points to the right -->
      <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
    </a>
    <h1 id="screen-title"></h1>
  </header>

  <!-- Each screen is drawn into here by app.js -->
  <main id="screen"></main>

  <!-- Bottom navigation. In right-to-left, the first link appears on the right -->
  <nav class="tabbar">
    <a href="#/home" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span data-text="home"></span>
    </a>
    <a href="#/search" data-tab="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span data-text="search"></span>
    </a>
    <a href="#/add" data-tab="add" class="add-tab">
      <span class="add-circle">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </span>
      <span data-text="add"></span>
    </a>
    <a href="#/calendar" data-tab="calendar">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span data-text="calendar"></span>
    </a>
    <a href="#/groups" data-tab="groups">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
      <span data-text="groups"></span>
    </a>
  </nav>

  <!-- db.js must load first: app.js uses its functions.
       ?v=… is a version number: raise it on every update so phones
       download the new file instead of using an old saved copy. -->
  <script src="db.js?v=6"></script>
  <script src="quickadd.js?v=11"></script>
  <script src="sections.js?v=11"></script>
  <script src="calendar.js?v=9"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
