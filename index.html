<!DOCTYPE html>
<!-- lang="he" = Hebrew, dir="rtl" = everything flows right-to-left -->
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- Fit the phone screen. viewport-fit=cover lets us use the full screen on phones with a notch -->
  <!-- interactive-widget: when the keyboard opens, shrink the page so the typing box stays visible -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- Color of the phone's top bar (light / dark) -->
  <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
  <title>הפתקים שלי</title>
  <!-- Makes it installable: name, icon, full screen (see manifest.json) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/rubik-hebrew.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar: back arrow (inner screens), title, and icon buttons -->
  <header class="topbar">
    <a id="back-button" class="icon-button back-button" href="#/home" hidden aria-label="חזרה">
      <!-- In right-to-left, "back" points to the right -->
      <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
    </a>
    <h1 id="screen-title"></h1>
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>

  <!-- Each screen is drawn into here by app.js -->
  <main id="screen"></main>

  <!-- Quick add, at the bottom of Home and of each group (setupAddBar in app.js) -->
  <form class="addbar" id="addbar" hidden>
    <div class="addbar-inner">
      <div class="group-picker" id="group-picker" hidden></div>
      <button type="button" class="chip guess-chip" id="guess-chip" hidden></button>
      <div class="addbar-row">
        <textarea id="quick-text" rows="1" dir="auto" enterkeyhint="done"></textarea>
        <button class="send-button" aria-label="שמירה">
          <svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
        </button>
      </div>
    </div>
  </form>

  <!-- Short messages like "Saved · Undo" (see showToast in app.js) -->
  <div class="toast" id="app-toast" hidden></div>

  <!-- db.js must load first, app.js last: it uses all the others.
       (Updates reach the phone through sw.js, which always asks for
       the newest files first.) -->
  <script src="icons.js"></script>
  <script src="db.js"></script>
  <script src="quickadd.js"></script>
  <script src="places.js"></script>
  <script src="sections.js"></script>
  <script src="calendar.js"></script>
  <script src="groups.js"></script>
  <script src="search.js"></script>
  <script src="daily.js"></script>
  <script src="drive.js"></script>
  <script src="backup.js"></script>
  <script src="sync.js"></script>
  <script src="push.js"></script>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
